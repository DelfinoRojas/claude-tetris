name: Claude Issue Triage

on:
  issues:
    types: [opened, edited]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Número del issue a triar manualmente'
        required: true
        type: string

# Una edición rápida tras otra no lanza triajes solapados sobre el mismo issue
concurrency:
  group: claude-issue-triage-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: true

jobs:
  triage:
    # Evita bucles: no re-triar cuando el propio bot edita el issue
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Triage issue with Claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: >-
            --allowedTools "Read,Grep,Glob,Bash(gh issue view:*),Bash(gh label list:*),Bash(gh issue edit:*),Bash(gh issue comment:*),Bash(gh api:*)"
          prompt: |
            Eres el triador de issues del repositorio ${{ github.repository }}, un juego de
            Tetris en JavaScript vanilla (`index.html`, `game.js`, `style.css`). Lee `CLAUDE.md`
            antes de analizar: contiene la arquitectura y los invariantes del proyecto.

            Debes triar el issue número $ISSUE_NUMBER. Sigue estos pasos:

            1. Lee el issue:
               `gh issue view $ISSUE_NUMBER --json number,title,body,labels,author`
            2. Lee las labels válidas: `gh label list --json name,description`
            3. Analiza el código relevante con Read/Grep/Glob (`game.js`, `index.html`,
               `style.css`, `README.md`) para fundamentar el diagnóstico. No modifiques
               ningún archivo ni hagas commits.
            4. Aplica labels con
               `gh issue edit $ISSUE_NUMBER --add-label "<label>"` (puedes pasar varias
               separadas por coma). Reglas estrictas:
               - Usa ÚNICAMENTE labels devueltas por `gh label list`. Nunca crees labels nuevas.
               - Como máximo 3 labels, y solo si encajan con claridad.
               - No quites labels que ya tenga el issue; solo añade las que falten.
            5. Publica el diagnóstico como comentario, SIEMPRE en español, con este formato
               exacto (la primera línea es un marcador HTML oculto, imprescindible):

               <!-- claude-triage -->
               ## Triaje automático

               **Resumen:** una o dos frases con lo que pide o reporta el issue.

               **Clasificación:** tipo de issue y labels aplicadas, con una frase de motivo.

               **Análisis:** archivos y funciones probablemente implicados (cítalos como
               `game.js:123`), y la hipótesis de causa o del punto donde habría que tocar.
               Si el issue toca rotación, colisión, bucle de juego o canvas, respeta los
               invariantes de `CLAUDE.md` (índice de pieza = color = valor de celda, tamaños
               de canvas duplicados en HTML, rotación que no es SRS, sin lock delay).

               **Falta información:** lo que haría falta para reproducir o decidir; escribe
               "Nada pendiente" si el issue está completo.

               **Siguiente paso sugerido:** una acción concreta.

               _Generado automáticamente por Claude. Última actualización: <fecha UTC>._

            6. IMPORTANTE — actualiza en vez de duplicar. Antes de comentar, busca un
               comentario previo de triaje:
               `gh api repos/${{ github.repository }}/issues/$ISSUE_NUMBER/comments --paginate --jq '.[] | select(.body | contains("<!-- claude-triage -->")) | .id'`
               - Si devuelve un id, edita ese comentario:
                 `gh api -X PATCH repos/${{ github.repository }}/issues/comments/<id> -f body="$(cat cuerpo.md)"`
               - Si no hay ninguno, créalo:
                 `gh issue comment $ISSUE_NUMBER --body-file cuerpo.md`
               Escribe el cuerpo en un archivo temporal (`cuerpo.md`) y pásalo con
               `--body-file` / `-f body=...` para no romper el markdown con comillas.

            No comentes nada fuera de ese bloque, no cierres ni asignes el issue, y no abras PRs.
